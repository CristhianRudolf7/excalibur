[package]
name = "excalibur-browser"
version = "0.1.0"
edition = "2024"

[dependencies]
excalibur-cdp = { path = "../cdp" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "io-util", "net"] }

rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
sha2 = "0.10"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
