[package]
name = "excalibur-security"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-types = { path = "../types" }
excalibur-store = { path = "../store" }
excalibur-vault = { path = "../vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
sha2 = "0.10"
regex = "1"
globset = "0.4"
shell-words = "1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
[dev-dependencies]
excalibur-sandbox = { path = "../sandbox" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
excalibur-tools = { path = "../tools" }
excalibur-engine = { path = "../engine" }
excalibur-models = { path = "../models" }
excalibur-journal = { path = "../journal" }
excalibur-context = { path = "../context" }
