[package]
name = "excalibur-decider"
version = "0.1.0"
edition = "2024"

[dependencies]
excalibur-types = { path = "../types" }
excalibur-providers = { path = "../providers" }
excalibur-models = { path = "../models" }
excalibur-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
