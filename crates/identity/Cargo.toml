[package]
name = "excalibur-identity"
version = "0.1.0"
edition = "2024"

[dependencies]
excalibur-store = { path = "../store" }
excalibur-vault = { path = "../vault" }
# Pure-Rust RustCrypto Argon2 (argon2id). Only the raw-hash API is used, so the
# PHC string parser (password-hash) is not pulled in.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
# Already in the workspace lock through rustls; used only for Ed25519 device-key verification.
ring = "0.17"
subtle = "2.6"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
