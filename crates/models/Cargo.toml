[package]
name = "excalibur-models"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-types = { path = "../types" }
excalibur-journal = { path = "../journal" }
excalibur-providers = { path = "../providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
jsonschema = { version = "0.60.2", default-features = false }
httpdate = "1"
[dev-dependencies]
excalibur-engine = { path = "../engine" }
excalibur-store = { path = "../store" }
excalibur-context = { path = "../context" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
