[package]
name = "excalibur-master"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-types = { path = "../types" }
excalibur-context = { path = "../context" }
excalibur-tools = { path = "../tools" }
excalibur-models = { path = "../models" }
excalibur-store = { path = "../store" }
excalibur-vault = { path = "../vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
futures = "0.3"
aho-corasick = "1"
jsonschema = { version = "0.60.2", default-features = false }
chrono = "0.4"
chrono-tz = "0.10"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util", "macros", "sync", "time"] }
