[package]
name = "excalibur-tasks"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-store = { path = "../store" }
excalibur-journal = { path = "../journal" }
excalibur-types = { path = "../types" }
excalibur-sandbox = { path = "../sandbox" }
excalibur-vault = { path = "../vault" }
excalibur-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
ulid = "1"
globset = "0.4"
cap-std = "3"
[dev-dependencies]
excalibur-tools = { path = "../tools" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "test-util"] }
