[package]
name = "excalibur-workflow"
version = "0.1.0"
edition = "2024"

[dependencies]
excalibur-store = { path = "../store" }
excalibur-types = { path = "../types" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
