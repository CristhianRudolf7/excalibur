[package]
name = "excalibur-skills"
version = "0.1.0"
edition = "2024"

[dependencies]
cap-std = "3.4.6"
excalibur-store = { path = "../store" }
excalibur-context = { path = "../context" }
excalibur-types = { path = "../types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.60", default-features = false }
serde_yaml_ng = "=0.10.0"
sha2 = "0.10"
thiserror = "2"
notify = "=8.2.0"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "test-util"] }
