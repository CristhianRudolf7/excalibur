[package]
name = "excalibur-search"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tantivy = { version = "0.27.0", default-features = false, features = ["mmap"], optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[features]
tantivy = ["dep:tantivy"]
