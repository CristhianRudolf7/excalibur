[package]
name = "excalibur-orchestrator"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-engine = { path = "../engine" }
excalibur-journal = { path = "../journal" }
excalibur-context = { path = "../context" }
excalibur-store = { path = "../store" }
excalibur-security = { path = "../security" }
excalibur-types = { path = "../types" }
excalibur-tasks = { path = "../tasks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
futures = "0.3"
sha2 = "0.10"
chrono = "0.4"
chrono-tz = "0.10"
[dev-dependencies]
excalibur-models = { path = "../models" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
