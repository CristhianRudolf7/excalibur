[package]
name = "excalibur-scheduler"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jiff = { version = "=0.2.38", features = ["serde"] }
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
