[package]
name = "excalibur-journal"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-types = { path = "../types" }
excalibur-store = { path = "../store" }
excalibur-vault = { path = "../vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
