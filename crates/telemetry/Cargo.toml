[package]
name = "excalibur-telemetry"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-store = { path = "../store" }
excalibur-journal = { path = "../journal" }
excalibur-types = { path = "../types" }
excalibur-vault = { path = "../vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
jsonschema = { version = "0.60.2", default-features = false }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_JobObjects"] }
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util"] }
