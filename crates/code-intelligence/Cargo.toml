[package]
name = "excalibur-code-intelligence"
version = "0.1.0"
edition = "2024"

[dependencies]
excalibur-store = { path = "../store" }
excalibur-sandbox = { path = "../sandbox" }
excalibur-vault = { path = "../vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
url = "2"
regex = "1"
libc = "0.2"
cap-std = "3"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-json = "=0.24.8"
tree-sitter-md = "=0.5.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
