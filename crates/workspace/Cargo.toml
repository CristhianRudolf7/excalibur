[package]
name = "excalibur-workspace"
version = "0.1.0"
edition = "2024"
[dependencies]
excalibur-store = { path = "../store" }
excalibur-types = { path = "../types" }
excalibur-vault = { path = "../vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "process", "io-util"] }
tempfile = "3"
ignore = "0.4"
diffy = "0.5.2"
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
