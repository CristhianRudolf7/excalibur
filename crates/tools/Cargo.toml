[package]
name = "excalibur-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
excalibur-sandbox = { path = "../sandbox" }
excalibur-vault = { path = "../vault" }
excalibur-types = { path = "../types" }
excalibur-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.60.2", default-features = false }
json5 = "0.4"
sha2 = "0.10"
fs2 = "0.4"
regex = "1"
regex-automata = { version = "0.4", features = ["dfa-build", "dfa-search", "syntax"] }
ignore = "0.4"
globset = "0.4"
similar = "2"
cap-std = "3"
portable-pty = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "io-util", "process"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_Security"] }
