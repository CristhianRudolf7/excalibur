[package]
name = "excalibur-webd"
version = "0.1.0"
edition = "2024"

[dependencies]
excalibur-browser = { path = "../browser" }
excalibur-browser-resources = { path = "../browser-resources" }
excalibur-sandbox = { path = "../sandbox" }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "io-util", "macros", "sync"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
